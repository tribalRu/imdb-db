repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        alias: python
        files: ^backend/
        args: ["--line-length=120"]
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: isort (python)
        alias: python
        files: ^backend/
        args: ["--profile", "black", "-l 120"]
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        alias: python
        files: ^backend/
        args: ["--max-complexity=12", "--max-line-length=120", "--extend-ignore=E203,W503"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint-frontend
        entry: npm run --prefix ./frontend lint:fix
        language: system
        files: ^frontend/.*\.[jt]sx?$
        pass_filenames: false
      - id: prettier-frontend
        name: prettier-frontend
        entry: npm run --prefix ./frontend format
        language: system
        files: ^frontend/
        pass_filenames: false

exclude: 'backend/alembic/.*'
